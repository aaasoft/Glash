name: Release GlashClientDesktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.28.824)'
        required: true
        type: string

env:
  PROJECT_PATH: GlashClientDesktop/GlashClientDesktop.csproj
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-x86
            archive: zip
          - os: windows-latest
            rid: win-arm64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation tools (linux-arm64)
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # Replace default objcopy with cross-version so .NET Native AOT can process ARM64 binaries
          sudo update-alternatives --install /usr/bin/objcopy objcopy /usr/bin/aarch64-linux-gnu-objcopy 100

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag: $TAG)"

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Remove PDB files
        shell: bash
        run: find publish/${{ matrix.rid }} -name '*.pdb' -delete

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath GlashClientDesktop-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip

      - name: Assemble .app bundle (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          APP_DIR="GlashClientDesktop.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          shopt -s dotglob
          mv publish/${{ matrix.rid }}/* "${APP_DIR}/Contents/MacOS/"
          shopt -u dotglob

          # 使用仓库自带 Resource/logo.png 生成 macOS 图标 .icns（失败则退化为无自定义图标）
          mkdir -p AppIcon.iconset
          cp "Resource/logo.png" "AppIcon.iconset/icon_512x512.png"
          for s in 512 256 128 32 16; do
            sips -z "$s" "$s" "AppIcon.iconset/icon_512x512.png" \
              --out "AppIcon.iconset/icon_${s}x${s}.png" || true
          done
          iconutil --convert icns -o AppIcon.icns AppIcon.iconset || true
          if [ -f AppIcon.icns ]; then
            mv AppIcon.icns "${APP_DIR}/Contents/Resources/"
          fi

          # 写 Info.plist（CFBundleExecutable 必须与可执行文件名一致）
          cat > "${APP_DIR}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>GlashClientDesktop</string>
              <key>CFBundleDisplayName</key>
              <string>GlashClientDesktop</string>
              <key>LSHasLocalizedDisplayName</key>
              <true/>
              <key>CFBundleExecutable</key>
              <string>GlashClientDesktop</string>
              <key>CFBundleIdentifier</key>
              <string>com.aaasoft.glash.client</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon.icns</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>en</string>
                  <string>zh-Hans</string>
              </array>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # 中文系统显示名：Glash客户端（仅中文 macOS 生效，其它语言回退到 CFBundleDisplayName）
          mkdir -p "${APP_DIR}/Contents/Resources/zh-Hans.lproj"
          printf '"CFBundleDisplayName" = "Glash客户端";\n"CFBundleName" = "Glash客户端";\n' \
            > "${APP_DIR}/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"

      - name: Package (tar.gz - macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: tar -czf GlashClientDesktop-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.tar.gz -C . GlashClientDesktop.app

      - name: Package (tar.gz - linux)
        if: matrix.archive == 'tar.gz' && !startsWith(matrix.rid, 'osx-')
        run: tar -czf GlashClientDesktop-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: GlashClientDesktop-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: List release files
        run: ls -lhR packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GlashClientDesktop ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: packages/*
