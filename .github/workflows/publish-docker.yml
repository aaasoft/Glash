name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Glash/**'
      - 'GlashAgentConsole/**'
      - 'GlashAgentWeb/**'
      - 'GlashClientWeb/**'
      - 'GlashServerWeb/**'
      - 'Glash.Blazor.Agent/**'
      - 'Glash.Blazor.Client/**'
      - 'Glash.Blazor.Server/**'
      - '.github/workflows/publish-docker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Glash/**'
      - 'GlashAgentConsole/**'
      - 'GlashAgentWeb/**'
      - 'GlashClientWeb/**'
      - 'GlashServerWeb/**'
      - 'Glash.Blazor.Agent/**'
      - 'Glash.Blazor.Client/**'
      - 'Glash.Blazor.Server/**'
      - '.github/workflows/publish-docker.yml'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: glash-agent-console
            dockerfile: ./GlashAgentConsole/Dockerfile
            readme: ./GlashAgentConsole/README.md
          - image: glash-agent-web
            dockerfile: ./GlashAgentWeb/Dockerfile
            readme: ./GlashAgentWeb/README.md
          - image: glash-client-web
            dockerfile: ./GlashClientWeb/Dockerfile
            readme: ./GlashClientWeb/README.md
          - image: glash-server-web
            dockerfile: ./GlashServerWeb/Dockerfile
            readme: ./GlashServerWeb/README.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          readme-filepath: ${{ matrix.readme }}
